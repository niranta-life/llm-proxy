# Ingress only: who may reach Postgres pods. Ports and namespaces are from memory. (not yet verified live: "Verify first" U11 in docs/gcp-deployment.md)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-pg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: llm-pg
  policyTypes: [Ingress]
  ingress:
    - from: # the app
        - podSelector:
            matchLabels:
              app: llm-proxy
      ports:
        - port: 5432
    - from: # replication between instances
        - podSelector:
            matchLabels:
              cnpg.io/cluster: llm-pg
      ports:
        - { port: 5432 }
        - { port: 8000 }
    - from: # CNPG operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { port: 5432 }
        - { port: 8000 }
    - from: # Managed Prometheus scrape
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - port: 9187
