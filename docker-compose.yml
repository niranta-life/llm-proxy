name: llm-proxy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_proxy
      MIGRATOR_PASSWORD: migrator_local_dev
      AUTH_PASSWORD: auth_local_dev
      RUNTIME_PASSWORD: runtime_local_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_proxy"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - private

  app:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: llm_proxy
      MIGRATOR_USER: llm_migrator
      MIGRATOR_PASSWORD: migrator_local_dev
      AUTH_USER: llm_auth
      AUTH_PASSWORD: auth_local_dev
      RUNTIME_USER: llm_runtime
      RUNTIME_PASSWORD: runtime_local_dev
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INFERENCE_ENABLED: ${INFERENCE_ENABLED:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      PROVIDER_CREDENTIAL_KEY: ${PROVIDER_CREDENTIAL_KEY:-}
      PROVIDER_CREDENTIAL_KEY_PREVIOUS: ${PROVIDER_CREDENTIAL_KEY_PREVIOUS:-}
      MAX_ACTIVE_STREAMS: ${MAX_ACTIVE_STREAMS:-32}
      MAX_STREAMS_PER_TENANT: ${MAX_STREAMS_PER_TENANT:-32}
      STREAM_SHUTDOWN_DRAIN_MS: ${STREAM_SHUTDOWN_DRAIN_MS:-5000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-620000}
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-60000}
      MIGRATION_STATEMENT_TIMEOUT_MS: ${MIGRATION_STATEMENT_TIMEOUT_MS:-600000}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-postgres}
      REDIS_SHADOW_CHECKS: ${REDIS_SHADOW_CHECKS:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: ${REDIS_TLS:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_TLS_CERT_FILE: ${REDIS_TLS_CERT_FILE:-}
      REDIS_TLS_KEY_FILE: ${REDIS_TLS_KEY_FILE:-}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-}
      REDIS_RECONNECT_TIMEOUT_MS: ${REDIS_RECONNECT_TIMEOUT_MS:-}
      REDIS_BREAKER_COOLDOWN_MS: ${REDIS_BREAKER_COOLDOWN_MS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - private

  redis:
    image: redis:7
    profiles: ["redis"]
    command:
      [
        "redis-server",
        "--aclfile",
        "/opt/users.acl",
        "--port",
        "6379",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    volumes:
      - ./docker/redis/users.acl:/opt/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "proxy", "--pass", "local_redis_shadow_pw", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - private

  ingress:
    build:
      context: ./docker/nginx
    image: llm-proxy-ingress:local
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/admin-allowlist.conf:/etc/nginx/admin-allowlist.conf:ro
      - ./config/ingress/live:/etc/nginx/ingress:ro
    tmpfs:
      - /etc/nginx/tls:mode=755
      - /var/cache/nginx:mode=1777
      - /run:mode=1777
      - /tmp:mode=1777
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/check-ingress"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    networks:
      private: {}
      approved:
        ipv4_address: 10.90.10.20

networks:
  private:
    name: llm-proxy-private
  approved:
    name: llm-proxy-approved
    ipam:
      config:
        - subnet: 10.90.10.0/24

volumes:
  pgdata:
