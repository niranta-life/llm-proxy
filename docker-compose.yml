name: llm-proxy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_proxy
      MIGRATOR_PASSWORD: migrator_local_dev
      AUTH_PASSWORD: auth_local_dev
      RUNTIME_PASSWORD: runtime_local_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_proxy"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: llm_proxy
      MIGRATOR_USER: llm_migrator
      MIGRATOR_PASSWORD: migrator_local_dev
      AUTH_USER: llm_auth
      AUTH_PASSWORD: auth_local_dev
      RUNTIME_USER: llm_runtime
      RUNTIME_PASSWORD: runtime_local_dev
      LOG_LEVEL: info
      INFERENCE_ENABLED: ${INFERENCE_ENABLED:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      PROVIDER_CREDENTIAL_KEY: ${PROVIDER_CREDENTIAL_KEY:-}
      MAX_ACTIVE_STREAMS: ${MAX_ACTIVE_STREAMS:-32}
      MAX_STREAMS_PER_TENANT: ${MAX_STREAMS_PER_TENANT:-32}
      STREAM_SHUTDOWN_DRAIN_MS: ${STREAM_SHUTDOWN_DRAIN_MS:-5000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-620000}
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-60000}
      MIGRATION_STATEMENT_TIMEOUT_MS: ${MIGRATION_STATEMENT_TIMEOUT_MS:-600000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  pgdata:
