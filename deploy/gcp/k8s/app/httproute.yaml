apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-proxy
spec:
  parentRefs:
    - name: llm-proxy-gw
      namespace: llm-proxy
      sectionName: https
  hostnames: ["__DOMAIN__"]
  rules:
    - backendRefs:
        - name: llm-proxy
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-proxy-redirect
spec:
  parentRefs:
    - name: llm-proxy-gw
      namespace: llm-proxy
      sectionName: http
  hostnames: ["__DOMAIN__"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
