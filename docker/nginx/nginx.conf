worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    tcp_nodelay on;
    sendfile on;

    # Keep the client connection open for the application keep-alive ceiling.
    keepalive_timeout 620s;

    # Reject a body larger than the application default of 1048576 bytes.
    client_max_body_size 1m;

    # Do not compress a response. A text/event-stream must stay intact.
    gzip off;

    log_format ingress '$remote_addr $status "$request"';
    access_log /dev/stdout ingress;

    map $sent_http_content_type $event_stream {
        default                 0;
        "~*text/event-stream"   1;
    }

    upstream llm_app {
        server app:8080;
        keepalive 8;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_trusted_certificate /etc/nginx/tls/ca.crt;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # These timeouts are longer than the application stream ceiling of 600000 ms.
        proxy_connect_timeout 630s;
        proxy_read_timeout 630s;
        proxy_send_timeout 630s;
        send_timeout 630s;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_ignore_client_abort off;

        # Send the client tenant headers. Overwrite forwarding headers.
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "for=$remote_addr;proto=https;host=$host";
        proxy_set_header Connection "";

        location = /health/ingress {
            auth_request /_ingress_app_ready;
            error_page 401 403 500 = @ingress_app_down;
            default_type application/json;
            add_header X-Ingress-Nginx ready always;
            return 200 '{"nginx":"ready","application":"ready"}\n';
        }

        location @ingress_app_down {
            default_type application/json;
            add_header X-Ingress-Nginx ready always;
            return 503 '{"nginx":"ready","application":"not_ready"}\n';
        }

        location = /_ingress_app_ready {
            internal;
            proxy_pass http://llm_app/health/ready;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        location /internal/ {
            include /etc/nginx/admin-allowlist.conf;
            error_page 403 = @ingress_forbidden;
            proxy_pass http://llm_app;
        }

        location @ingress_forbidden {
            default_type application/json;
            return 403 '{"error":"ingress_forbidden"}\n';
        }

        location /mcp {
            default_type application/json;
            if ($http_x_tenant_id = "") {
                return 401 '{"error":"ingress_unauthorized"}\n';
            }
            if ($http_authorization = "") {
                return 401 '{"error":"ingress_unauthorized"}\n';
            }
            proxy_buffering off;
            gzip off;
            proxy_pass http://llm_app;
        }

        # text/event-stream uses this path. Do not buffer it. Do not compress it.
        location /v1/chat/completions {
            proxy_buffering off;
            gzip off;
            proxy_pass http://llm_app;
        }

        location / {
            proxy_buffering off;
            gzip off;
            proxy_pass http://llm_app;
        }
    }
}
